<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Results | Kioko</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <link rel="apple-touch-icon" href="images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/slick.css" />
  <link rel="stylesheet" href="css/slick-theme.css" />
  <link rel="stylesheet" href="css/owl.carousel.min.css" />
  <link rel="stylesheet" href="css/animate.min.css" />
  <link rel="stylesheet" href="css/magnific-popup.css" />
  <link rel="stylesheet" href="css/select2.min.css" />
  <link rel="stylesheet" href="css/select2-bootstrap4.min.css" />
  <link rel="stylesheet" href="css/slick-animation.css" />
  <link rel="stylesheet" href="style.css?v=38" />
</head>
<body class="tmdb-results-page">
  <header id="main-header">
    <div class="main-header">
      <div class="container-fluid">
        <div class="row">
          <div class="col-sm-12">
            <nav class="navbar navbar-expand-lg navbar-light p-0">
              <a href="#" class="navbar-toggler c-toggler" data-toggle="collapse" data-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <div class="navbar-toggler-icon" data-toggle="collapse">
                  <span class="navbar-menu-icon navbar-menu-icon--top"></span>
                  <span class="navbar-menu-icon navbar-menu-icon--middle"></span>
                  <span class="navbar-menu-icon navbar-menu-icon--bottom"></span>
                </div>
              </a>
              <a href="index.html" class="navbar-brand">
                <img src="images/logo.png" class="img-fluid logo" alt="Kioko" />
              </a>
              <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <div class="menu-main-menu-container">
                  <ul id="top-menu" class="navbar-nav ml-auto">
                    <li class="menu-item"><a href="index.html#home">Home</a></li>
                    <li class="menu-item"><a href="search-results.html?type=movie&amp;page=1">Movies</a></li>
                    <li class="menu-item"><a href="search-results.html?type=tv&amp;page=1">Shows</a></li>
                  </ul>
                </div>
              </div>
              <div class="mobile-more-menu">
                <a href="#" class="search-toggle" aria-label="Search">
                  <i class="fa fa-search"></i>
                </a>
                <div class="search-box iq-search-bar">
                  <form action="#" class="searchbox">
                    <div class="form-group position-relative">
                      <input type="text" class="text search-input font-size-12" placeholder="type here to search..." />
                      <i class="search-link fa fa-search"></i>
                    </div>
                  </form>
                </div>
              </div>
              <div class="navbar-right menu-right">
                <ul class="d-flex align-items-center list-inline m-0">
                  <li class="nav-item nav-icon">
                    <a href="#" class="search-toggle device-search" aria-label="Search">
                      <i class="fa fa-search"></i>
                    </a>
                    <div class="search-box iq-search-bar d-search">
                      <form action="#" class="searchbox">
                        <div class="form-group position-relative">
                          <input type="text" class="text search-input font-size-12" placeholder="type here to search..." />
                          <i class="search-link fa fa-search"></i>
                        </div>
                      </form>
                    </div>
                  </li>
                </ul>
              </div>
            </nav>
            <div class="nav-overlay"></div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="tmdb-results-main">
    <section class="tmdb-results-section is-visible">
      <div class="tmdb-results-header">
        <h1 id="search-title">All Movies</h1>
      </div>

      <div class="tmdb-filter-bar" id="results-filters" aria-label="Movie and show filters">
        <div class="tmdb-filter-box">
          <label for="sort-select">Sort:</label>
          <select id="sort-select" aria-label="Sort results">
            <option value="popularity.desc" selected>Popular</option>
            <option value="vote_count.desc">Most Watched</option>
            <option value="vote_average.desc">Top Rated</option>
          </select>
        </div>
        <div class="tmdb-filter-box">
          <label for="genre-select">Genre:</label>
          <select id="genre-select" aria-label="Filter by genre">
            <option value="">All Genres</option>
          </select>
        </div>
        <div class="tmdb-filter-box">
          <label for="year-select">Year:</label>
          <select id="year-select" aria-label="Filter by year">
            <option value="">All Years</option>
          </select>
        </div>
      </div>

      <div class="tmdb-results-grid" id="results-grid" aria-live="polite">
        <div class="tmdb-search-message">Searching TMDB...</div>
      </div>
      <nav class="tmdb-pagination" id="tmdb-pagination" aria-label="Results pages"></nav>
    </section>
  </main>

  <script src="js/jquery-3.4.1.min.js"></script>
  <script src="js/popper.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/owl.carousel.min.js"></script>
  <script src="js/slick.min.js"></script>
  <script src="js/slick-animation.min.js"></script>
  <script src="main.js?v=28"></script>
  <script src="search-results.js?v=11"></script>
</body>
</html>
