<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Results | Kioko</title>
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    html, body { margin: 0; background: #05070a; color: #eceef1; }
    .tmdb-results-main { padding: 28px 22px 48px; }
    .tmdb-results-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px 16px; max-width: 1320px; margin: 0 auto; }
    .tmdb-result { display: flex; min-width: 0; flex-direction: column; overflow: hidden; color: #fff; text-decoration: none; }
    .tmdb-result img { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 9px; object-fit: cover; }
    .tmdb-result-content { display: flex; flex-direction: column; gap: 5px; padding: 9px 2px 0; }
    @media (max-width: 900px) { .tmdb-results-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 600px) { .tmdb-results-main { padding: 22px 14px 36px; } .tmdb-results-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 10px; } }
  </style>
  <link rel="stylesheet" href="style.css?v=26" />
</head>
<body class="tmdb-results-page">
  <header class="tmdb-results-page-header">
    <a href="index.html" class="tmdb-results-logo">Kioko</a>
    <a href="index.html" class="tmdb-results-home"><i class="fa fa-arrow-left"></i> Back home</a>
  </header>

  <main class="tmdb-results-main">
    <section class="tmdb-results-section is-visible">
      <div class="tmdb-results-header">
        <h1 id="search-title">Search results</h1>
      </div>
      <div class="tmdb-results-grid" id="results-grid" aria-live="polite">
        <div class="tmdb-search-message">Searching TMDB...</div>
      </div>
      <nav class="tmdb-pagination" id="tmdb-pagination" aria-label="Results pages"></nav>
    </section>
  </main>

  <script src="search-results.js?v=4"></script>
</body>
</html>
